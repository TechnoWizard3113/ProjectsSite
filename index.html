<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding & Project Portfolio</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --text-color: #333;
            --card-radius: 12px;
            --transition-speed: 0.3s;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        h2.section-title {
            width: 100%;
            max-width: 1400px;
            font-size: 1.5rem;
            color: #2c3e50;
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
            margin-top: 40px;
            margin-bottom: 20px;
        }

        /* Responsive Portfolio Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            width: 100%;
            max-width: 1400px;
            margin-bottom: 20px;
        }

        /* Fully Clickable Picture Card */
        .portfolio-card {
            position: relative;
            display: block;
            border-radius: var(--card-radius);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            text-decoration: none;
            aspect-ratio: 16 / 10;
            transition: transform var(--transition-speed) ease, box-shadow var(--transition-speed) ease;
            background-color: #2c3e50;
        }

        .portfolio-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        /* Full Background Image Setup */
        .portfolio-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-speed) ease;
        }

        .portfolio-card:hover img {
            transform: scale(1.04);
        }

        /* Text Overlay */
        .card-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.85));
            padding: 20px;
            color: #fff;
        }

        .card-overlay h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .card-overlay p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <header>
        <h1>Coding & Project Portfolio</h1>
        <p>A collection of my web tools, Minecraft mod projects, guides, and other development work.</p>
    </header>

    <!-- SECTION 1: Minecraft Technical Support & Troubleshooting -->
    <h2 class="section-title">Minecraft Technical Support & Troubleshooting</h2>
    <div class="portfolio-grid" id="supportGrid"></div>

    <!-- SECTION 2: Minecraft Mod Projects & Creation -->
    <h2 class="section-title">Minecraft Mod Projects & Creation</h2>
    <div class="portfolio-grid" id="modProjectsGrid"></div>

    <!-- SECTION 3: Other Projects -->
    <h2 class="section-title">Other Projects</h2>
    <div class="portfolio-grid" id="otherProjectsGrid"></div>

    <script>
        // Section 1 Data: Minecraft Technical Support & Troubleshooting
        const supportProjects = [
            { title: "Server Issue Ticket Reference", desc: "Documentation for troubleshooting server plugin file placement and loading issues.", url: "#", img: "https://unsplash.com" },
            { title: "Admin Permissions Setup", desc: "Guide for configuring operator status and running administrative commands in server consoles.", url: "#", img: "https://unsplash.com" },
            { title: "macOS LabyMod Microphone Fix", desc: "Technical guide for troubleshooting microphone and voice chat permissions on macOS.", url: "#", img: "https://unsplash.com" }
        ];

        // Section 2 Data: Minecraft Mod Projects & Creation
        const modProjects = [
            { title: "High Stakes Hotbar", desc: "Custom generated Minecraft mod created via CreativeMode.", url: "https://www.creativemode.net/mod/high-stakes-hotbar-lwqw7kqy", img: "https://unsplash.com" },
            { title: "Apex", desc: "Web tool / project related to Minecraft development.", url: "https://technowizard3113.github.io/Apex/", img: "https://unsplash.com" },
            { title: "ModrinthModDownloader", desc: "Automated utility for managing and downloading mods.", url: "https://technowizard3113.github.io/ModrinthModDownloader/", img: "https://unsplash.com" },
            { title: "SkriptForge", desc: "Custom skript development and management tool.", url: "https://technowizard3113.github.io/SkriptForge/", img: "https://unsplash.com" },
            { title: "SkriptGUIBuilder", desc: "Visual GUI builder interface for Minecraft Skripts.", url: "https://technowizard3113.github.io/skript-gui-builder/", img: "https://unsplash.com" }
        ];

        // Section 3 Data: Other Projects
        const otherProjects = [
            { title: "Project Six", desc: "Short description of website 6", url: "#", img: "https://unsplash.com" },
            { title: "Project Seven", desc: "Short description of website 7", url: "#", img: "https://unsplash.com" },
            { title: "Project Eight", desc: "Short description of website 8", url: "#", img: "https://unsplash.com" },
            { title: "Project Nine", desc: "Short description of website 9", url: "#", img: "https://unsplash.com" },
            { title: "Project Ten", desc: "Short description of website 10", url: "#", img: "https://unsplash.com" },
            { title: "Project Eleven", desc: "Short description of website 11", url: "#", img: "https://unsplash.com" },
            { title: "Project Twelve", desc: "Short description of website 12", url: "#", img: "https://unsplash.com" },
            { title: "Project Thirteen", desc: "Short description of website 13", url: "#", img: "https://unsplash.com" },
            { title: "Project Fourteen", desc: "Short description of website 14", url: "#", img: "https://unsplash.com" },
            { title: "Project Fifteen", desc: "Short description of website 15", url: "#", img: "https://unsplash.com" }
        ];

        // Function to build cards dynamically into their respective sections
        function renderGrid(containerId, items) {
            const grid = document.getElementById(containerId);
            items.forEach(p => {
                const card = document.createElement('a');
                card.href = p.url;
                card.target = "_blank";
                card.className = "portfolio-card";
                card.innerHTML = `
                    <img src="${p.img}" alt="${p.title}">
                    <div class="card-overlay">
                        <h3>${p.title}</h3>
                        <p>${p.desc}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Render all sections
        renderGrid('supportGrid', supportProjects);
        renderGrid('modProjectsGrid', modProjects);
        renderGrid('otherProjectsGrid', otherProjects);
    </script>
</body>
</html>
